<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Início | Login Seguro</title>

    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-autenticacao">

    <main class="cartao">
        <h1>Bem-vindo!</h1>
        <p class="descricao">Você acessou sua conta.</p>

        <p class="identificacao">
            Conectado como:
            <strong th:text="${email}"></strong>
        </p>

        <form class="formulario" th:action="@{/logout}" method="post">
            <button class="botao" type="submit">Sair</button>
        </form>
    </main>

</body>
</html>
