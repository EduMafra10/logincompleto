<!DOCTYPE html>
<html lang="pt-BR">
<head th:replace="~{fragmentos/layout :: cabecalho('Entrar')}">
</head>

<body class="pagina-autenticacao">

    <main class="cartao">
        <h1>Login Seguro</h1>
        <p class="descricao">Entre com seu e-mail e senha.</p>

        <div class="mensagem mensagem-erro"
            th:if="${param.erro != null}"
            role="alert">
            E-mail ou senha inválidos.
        </div>

        <div class="mensagem mensagem-sucesso"
            th:if="${param.logout != null}"
            role="status">
            Você saiu da sua conta.
        </div>

        <div class="mensagem mensagem-sucesso"
            th:if="${param.cadastro != null}"
            role="status">
            Cadastro realizado. Entre com seus dados.
        </div>

        <div class="mensagem mensagem-erro"
            role="alert"
            th:if="${param.sessao != null}">
        Sua sessão foi encerrada porque os dados de acesso mudaram.
        Entre novamente com uma conta ativa.
        </div>

        <form class="formulario" th:action="@{/login}" method="post">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email"
                       id="email"
                       name="email"
                       autocomplete="username"
                       maxlength="254"
                       required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password"
                       id="senha"
                       name="senha"
                       autocomplete="current-password"
                       required>
            </div>

            <button class="botao" type="submit">Entrar</button>
        </form>

        <p class="link-acesso">
            Ainda não tem uma conta?
            <a href="@{/cadastro}">Cadastre-se</a>
        </p>

    </main>
</body>
</html>
